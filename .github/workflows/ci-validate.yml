name: CI - Validate Intune Policy Changes

on:
  pull_request:
    paths:
      - "intune/**"

jobs:
  guardrail-and-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install IntuneCD
        run: pip install IntuneCD

      - name: Run policy-as-code guardrails
        run: python3 guardrails/validate_policy.py intune

      - name: Plan - diff against live tenant (no changes applied)
        env:
          TENANT_NAME: ${{ secrets.TENANT_NAME }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          IntuneCD-startupdate -m 1 -p ./intune -r -v -e ScopeTags Roles
