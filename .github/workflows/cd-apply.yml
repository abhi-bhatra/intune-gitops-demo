name: CD - Apply Intune Policy to Tenant

on:
  push:
    branches: [main, master]
    paths:
      - "intune/**"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install IntuneCD
        run: pip install IntuneCD

      - name: Re-run guardrails (defense in depth)
        run: python3 guardrails/validate_policy.py intune

      - name: Apply to tenant
        env:
          TENANT_NAME: ${{ secrets.TENANT_NAME }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          IntuneCD-startupdate -m 1 -p ./intune -v -g -e ScopeTags Roles
